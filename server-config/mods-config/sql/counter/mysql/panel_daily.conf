#  RadPanel: consulta do contador panel_daily (MariaDB/MySQL).
#  %{User-Name} e escapado pelo servidor antes de ir ao SQL.
query = "\
	SELECT IFNULL(SUM(acctsessiontime - GREATEST((%{control.Panel-Daily-Start} - UNIX_TIMESTAMP(acctstarttime)), 0)), 0) \
	FROM radacct \
	WHERE username = '%{User-Name}' \
	AND UNIX_TIMESTAMP(acctstarttime) + acctsessiontime > '%{control.Panel-Daily-Start}'"
