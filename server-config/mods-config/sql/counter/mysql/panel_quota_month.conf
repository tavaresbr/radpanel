#  RadPanel: consulta do contador panel_quota_month (MariaDB/MySQL).
#  %{User-Name} e escapado pelo servidor antes de ir ao SQL.
query = "\
	SELECT IFNULL(SUM(IFNULL(acctinputoctets, 0) + IFNULL(acctoutputoctets, 0)), 0) \
	FROM radacct \
	WHERE username = '%{User-Name}' \
	AND UNIX_TIMESTAMP(acctstarttime) >= '%{control.Panel-QuotaMonth-Start}'"
